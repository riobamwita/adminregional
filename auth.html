<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3555"><link rel="icon" href="assets/logo.jpg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="auth.css"><title>Admin Login</title></head><body><main class="auth"><div class="box"><img src="assets/logo.jpg" alt="Regional Autoselections"><span>REGIONAL AUTOSELECTIONS LTD</span><h1>Admin Access</h1><p>Sign in to manage listings and requests.</p><form id="authForm" novalidate><label>Email<input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Email" required></label><label>Password<div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></label><button id="login" class="login-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button><div id="msg" role="alert"></div></form></div></main><script type="module" src="auth.js"></script></body></html>
